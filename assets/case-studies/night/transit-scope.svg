<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><rect width="1000" height="620" fill="#0f1d2c"/><text x="45" y="55" font-family="sans-serif" font-size="28" fill="#f0f7fa">Transit-time classification / Clasificación de transit times</text><text x="45" y="95" font-family="sans-serif" font-size="24" fill="#6bdacb">50,000 orders · 50 matrices / 50,000 órdenes · 50 matrices</text><rect x="45" y="140" width="910" height="105" rx="12" fill="#193345" stroke="#6bdacb"/><text x="70" y="178" font-family="sans-serif" font-size="24" fill="#6bdacb">01 · Transform / Transformar</text><text x="70" y="218" font-family="sans-serif" font-size="21" fill="#f0f7fa">Normalize order fields / Normalizar campos</text><rect x="45" y="270" width="910" height="105" rx="12" fill="#193345" stroke="#6bdacb"/><text x="70" y="308" font-family="sans-serif" font-size="24" fill="#6bdacb">02 · Evaluate / Evaluar</text><text x="70" y="348" font-family="sans-serif" font-size="21" fill="#f0f7fa">Match matrix combinations / Evaluar combinaciones</text><rect x="45" y="400" width="910" height="105" rx="12" fill="#193345" stroke="#6bdacb"/><text x="70" y="438" font-family="sans-serif" font-size="24" fill="#6bdacb">03 · Classify / Clasificar</text><text x="70" y="478" font-family="sans-serif" font-size="21" fill="#f0f7fa">Explain assigned classification / Explicar clasificación</text><text x="45" y="570" font-family="sans-serif" font-size="17" fill="#a7becb">Scope confirmed by owner; diagram reconstructed / Alcance confirmado; esquema reconstruido</text></svg>